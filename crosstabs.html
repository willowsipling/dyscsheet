<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyscsheet crosstabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<link rel="stylesheet" href="dyscsheet.css">
<script src="dyscsheet-data.js"></script>
<script src="dyscsheet-tables.js"></script>
</head>
<body class="ct">
  <div class="topbar">
    <div class="wrap">
      <div class="title-row">
        <h1>dysc<span>sheet</span> <span class="view-name">crosstabs</span></h1>
        <nav class="menubar" aria-label="Menus">
          <div class="menu-wrap">
            <button class="menu-title" aria-expanded="false" aria-controls="fileMenu">File</button>
            <div class="menu" id="fileMenu" hidden>
              <button id="newPage" class="menu-item danger">New crosstab</button>
              <button id="open" class="menu-item">Open file</button>
              <input type="file" id="fileInput" accept=".json,application/json" hidden>
              <button id="save" class="menu-item">Save file</button>
              <button id="print" class="menu-item">Print / PDF</button>
            </div>
          </div>
          <div class="menu-wrap">
            <button class="menu-title" aria-expanded="false" aria-controls="editMenu">Edit</button>
            <div class="menu" id="editMenu" hidden>
              <button id="undo" class="menu-item">Undo</button>
              <button id="redo" class="menu-item">Redo</button>
              <hr>
              <button id="cutBtn" class="menu-item">Cut</button>
              <button id="copyBtn" class="menu-item">Copy</button>
              <button id="pasteBtn" class="menu-item">Paste</button>
            </div>
          </div>
          <div class="menu-wrap">
            <button class="menu-title" aria-expanded="false" aria-controls="viewMenu">View</button>
            <div class="menu" id="viewMenu" hidden>
              <span class="zoom">Zoom
                <button id="zoomOut" aria-label="Zoom out">−</button>
                <button id="zoomReset">100%</button>
                <button id="zoomIn" aria-label="Zoom in">+</button>
              </span>
            </div>
          </div>
          <div class="menu-wrap">
            <button class="menu-title" aria-expanded="false" aria-controls="sheetsMenu">Sheets</button>
            <div class="menu" id="sheetsMenu" hidden>
              <a class="menu-item" href="./">Worksheet</a>
              <a class="menu-item" href="crosstabs.html" aria-current="page">Crosstabs</a>
              <a class="menu-item" href="gamma.html">Gamma</a>
            </div>
          </div>
        </nav>
        <a href="docs.html">Documentation / How To</a>
        <a href="about.html">About</a>
      </div>
      <div class="ribbon">
        <div class="group" role="group" aria-label="Layout">
          <div class="group-body">
            <button data-layout="a" aria-pressed="false">Stacked cells</button>
            <button data-layout="c" aria-pressed="false">Matched tables</button>
          </div>
          <span class="group-label">Layout</span>
        </div>
        <div class="group" role="group" aria-label="Size">
          <div class="group-body">
            <span class="stepper">Rows
              <button id="rowLess" aria-label="One less row">−</button>
              <span id="rowCount" class="count"></span>
              <button id="rowMore" aria-label="One more row">+</button>
            </span>
            <span class="stepper">Columns
              <button id="colLess" aria-label="One less column">−</button>
              <span id="colCount" class="count"></span>
              <button id="colMore" aria-label="One more column">+</button>
            </span>
          </div>
          <span class="group-label">Size</span>
        </div>
        <div class="group" role="group" aria-label="What to show">
          <div class="group-body rows-2" id="slotBoxes"></div>
          <span class="group-label" id="slotLabel"></span>
        </div>
        <div class="group" role="group" aria-label="Modes">
          <div class="group-body">
            <button id="crossMode" aria-pressed="false">Crosshair</button>
          </div>
          <span class="group-label">Modes</span>
        </div>
      </div>
      <div class="ct-status" id="status" role="status" aria-live="polite" hidden></div>
    </div>
  </div>

  <div class="ct-scroll">
    <main class="wrap ct-main" id="main"></main>
  </div>

<script>
// A crosstab to fill in, for a chi-square test. The student picks which quantities to show,
// and whether they sit together in each cell or in matching tables. (See dyscsheet-tables.js.)
DYSC.tableSheet({
  store: 'dyscsheet.crosstab.v3',
  type: 'dyscsheet-crosstab',
  version: 3,
  noun: 'crosstab',
  fileName: 'dyscsheet-crosstab.json',
  corner: 'crosstabs',
  margins: true,
  slots: [
    { key: 'fo', name: 'f<sub>o</sub>', say: 'f o', title: 'f<sub>o</sub>: observed' },
    { key: 'pct', name: '%', say: 'percent', title: '%' },
    { key: 'fe', name: 'f<sub>e</sub>', say: 'f e', title: 'f<sub>e</sub>: expected' },
    { key: 'part', name: 'χ² part', say: 'chi-square part', title: 'χ² parts' },
  ],
  below: [
    ['∑ χ² =', 'chi', 'Chi-square'],
    ['df =', 'df', 'Degrees of freedom'],
    ['critical value =', 'crit', 'Critical value'],
  ],
  // Crosshair mode: a plum border marks the boxes a number is made from. % is down each column.
  onFocus: ({ slot, i, j, mark }) => {
    const all = (prefix) => mark(`[data-k^="${prefix}-"]`);
    const across = (prefix, n) => mark(`[data-k^="${prefix}-${n}-"]`);
    const down = (prefix, n) => mark(`[data-k^="${prefix}-"][data-k$="-${n}"]`);
    ({
      rm: () => across('fo', i),
      cm: () => down('fo', i),
      n: () => { all('rm'); all('cm'); },
      pct: () => { mark(`fo-${i}-${j}`); mark(`cm-${j}`); },
      fe: () => { mark(`rm-${i}`); mark(`cm-${j}`); mark('n'); },
      part: () => { mark(`fo-${i}-${j}`); mark(`fe-${i}-${j}`); },
      chi: () => all('part'),
      df: () => { all('rn'); all('cn'); },
      crit: () => mark('df'),
    }[slot] || (() => {}))();
  },
});
</script>
</body>
</html>
