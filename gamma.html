<script>
// Gamma by hand: each cell is "home" in turn. As taught in class, its concordant cells sit below
// and to the right, and its discordant cells above and to the right. CP and DP are the concordant
// and discordant pairs. Nothing is added or multiplied here; clicking a C or D box shades that
// cell's group, the way the crosshair shows its row and column. (See dyscsheet-tables.js.)
const hasC = (i, j, rows, cols) => i < rows - 1 && j < cols - 1;
const hasD = (i, j, rows, cols) => i > 0 && j < cols - 1;
DYSC.tableSheet({
  store: 'dyscsheet.gamma.v2',
  type: 'dyscsheet-gamma',
  version: 2,
  noun: 'gamma sheet',
  fileName: 'dyscsheet-gamma.json',
  corner: 'gamma',
  margins: false,
  // In twos, so each sum sits over its part in the toolbar. In the table, C and D are short for
  // concordant and discordant, which keeps the cells narrow.
  slots: [
    { key: 'fo', name: 'f<sub>o</sub>', say: 'f o', title: 'f<sub>o</sub>: observed' },
    null,
    { key: 'cs', name: 'concordant sum', tag: 'C sum', say: 'concordant sum', title: 'Concordant sums', has: hasC },
    { key: 'cp', name: 'CP part', say: 'C P part', title: 'CP parts', has: hasC },
    { key: 'ds', name: 'discordant sum', tag: 'D sum', say: 'discordant sum', title: 'Discordant sums', has: hasD },
    { key: 'dp', name: 'DP part', say: 'D P part', title: 'DP parts', has: hasD },
  ],
  below: [
    ['CP =', 'cpt', 'C P'],
    ['DP =', 'dpt', 'D P'],
    ['CP − DP =', 'diff', 'C P minus D P'],
    ['CP + DP =', 'sum', 'C P plus D P'],
    ['γ =', 'gamma', 'Gamma'],
  ],
  // Tab goes: names, every fo, then concordant from the top-left cell across each row and down,
  // then discordant from the bottom-left cell across each row and up, then the totals and γ.
  tabOrder: (rows, cols) => {
    const R = [...Array(rows).keys()], C = [...Array(cols).keys()];
    const cells = (rowOrder, keys) => rowOrder.flatMap((i) => C.flatMap((j) => keys.map((k) => `${k}-${i}-${j}`)));
    return [...C.map((j) => `cn-${j}`), ...R.map((i) => `rn-${i}`),
      ...cells(R, ['fo']), ...cells(R, ['cs', 'cp']), ...cells([...R].reverse(), ['ds', 'dp']),
      'cpt', 'dpt', 'diff', 'sum', 'gamma'];
  },
  marks: ['is-group'],
  // Concordant: rows below, columns to the right. Discordant: rows above, columns to the right.
  // A plum border marks the numbers that box is made from: a sum's fo boxes, a part's home fo and its sum,
  // and below the table, CP from the CP parts, DP from the DP parts, CP − DP and CP + DP from CP and DP,
  // and γ from CP − DP and CP + DP.
  onFocus: ({ slot, i, j, cells, mark }) => {
    const from = { cpt: ['[data-k^="cp-"]'], dpt: ['[data-k^="dp-"]'], diff: ['cpt', 'dpt'], sum: ['cpt', 'dpt'], gamma: ['diff', 'sum'] }[slot];
    if (from) { from.forEach(mark); return; }
    const up = { cs: false, cp: false, ds: true, dp: true }[slot];
    if (up === undefined) return;
    cells.forEach((c) => {
      const r = +c.dataset.i, k = +c.dataset.j;
      if (!((up ? r < i : r > i) && k > j)) return;
      c.classList.add('is-group');
      if (slot === 'cs' || slot === 'ds') mark(`fo-${r}-${k}`);
    });
    if (slot === 'cp') { mark(`fo-${i}-${j}`); mark(`cs-${i}-${j}`); }
    if (slot === 'dp') { mark(`fo-${i}-${j}`); mark(`ds-${i}-${j}`); }
  },
});
</script>
</body>
</html>
